<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- No `interactive-widget`: it would make the LAYOUT viewport change, and
     this app's screens are `height: 100%` in a chain (html, #app, .stats) -
     changing the layout while scrolling re-lays out everything and moves the
     scroll anchor. The keyboard is handled by the --kb variable, in
     src/ui.js, which works on both systems without touching the layout. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Hit Easy — commander made simple</title>
<meta name="description" content="Hit Easy — commander made simple. Contador de vida para mesas de Commander, com estatisticas por deck.">
<meta name="theme-color" content="#08080a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hit Easy">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script>
/* Theme before the first paint: without this, whoever uses light sees a
   dark flash on every open, because the CSS assumes dark until the app loads.
   It duplicates the localStorage key on purpose - a module cannot be imported
   here without delaying the paint, which is exactly what we want to avoid.
   The theme values 'claro' (light) and 'escuro' (dark) are stored settings. */
(function () {
  try {
    var cfg = (JSON.parse(localStorage.getItem('mtglc.db.v1')) || {}).settings || {};
    var light = cfg.theme === 'claro'
      || (cfg.theme !== 'escuro' && matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', light ? '#f4f4f2' : '#08080a');
  } catch (e) { /* first visit or blocked storage: stays dark */ }
})();
</script>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<main id="app"></main>
<script>
/* An error screen instead of a black screen.
   Without this, any exception while loading leaves #app empty and the user
   staring at the dark background with no clue - and on a phone there is no
   console to open. It is a classic script, before the module, to also catch
   the errors that happen while loading app.js itself. The texts below are
   shown to the user, so they stay in Portuguese. */
(function () {
  var shown = false;
  function show(title, detail) {
    if (shown) return;
    shown = true;
    var app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'crash';
    box.innerHTML =
      '<h1>Algo quebrou ao abrir</h1>' +
      '<p class="crash-sub">O app parou antes de desenhar a tela. O texto abaixo diz onde.</p>' +
      '<pre class="crash-detail"></pre>' +
      '<div class="crash-actions">' +
      '<button id="crash-reload" class="btn primary">Recarregar</button>' +
      '<button id="crash-reset" class="btn ghost">Limpar cache e recarregar</button>' +
      '</div>';
    box.querySelector('.crash-detail').textContent = title + '

' + (detail || '');
    app.appendChild(box);

    document.getElementById('crash-reload').onclick = function () { location.reload(); };
    document.getElementById('crash-reset').onclick = function () {
      /* Does not delete the match history - only the app cache, which is
         the most common suspect when a new version arrives halfway. */
      var ready = Promise.resolve();
      if (window.caches) ready = caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      });
      ready.then(function () {
        if (navigator.serviceWorker) {
          return navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          });
        }
      }).then(function () { location.reload(); });
    };
  }

  window.addEventListener('error', function (e) {
    show(e.message || 'Erro', (e.filename || '') + (e.lineno ? ':' + e.lineno : '') +
      (e.error && e.error.stack ? '

' + e.error.stack : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason || {};
    show(r.message || String(r), r.stack || '');
  });

  /* If nothing was drawn in 6s, something silent went wrong (the network
     dropped in the middle of loading the modules, for example). */
  window.addEventListener('load', function () {
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && app.children.length === 0) {
        show('O app nao desenhou nada em 6 segundos.',
          'Costuma ser um modulo que nao chegou. Tente "Limpar cache e recarregar", '
          + 'e confira se o servidor ainda esta no ar.');
      }
    }, 6000);
  });
})();
</script>
<script>
  /* Install prompt: captured BEFORE the modules.
   *
   * Chrome fires `beforeinstallprompt` as soon as it decides the page is
   * installable, and that can happen before src/install.js has been
   * evaluated. When it did, the event was lost and the install button simply
   * did not show - sometimes yes, sometimes no, with nothing changing on the
   * page. It was the classic symptom of a race, and the only fix is listening
   * from a place that already exists when the browser announces it.
   *
   * install.js reads this drawer when it starts. */
  window.__hitEasyInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__hitEasyInstall = e;
  });
  window.addEventListener('appinstalled', function () {
    window.__hitEasyInstall = null;
  });
</script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
