# Publishes two channels on the same GitHub Pages site.
#
#   main  ->  /hit-easy/        production, what the table uses
#   beta  ->  /hit-easy/beta/   beta, what you approve first
#
# The site is rebuilt whole on every run, always from both branches. An
# incremental deploy would give a state that depends on the order things were
# published in - and one day beta would delete production without anyone
# understanding why.
#
# A failing test does not publish. Since production is already live, blocking
# the deploy never takes anything down: at worst the table keeps the previous
# version.
#
# Rolling back: every production release is tagged (v1.9.0, v1.10.0, ...).
# Setting the repository variable PRODUCTION_REF to one of those tags makes
# production come from it instead of `main`, on this run and on every run
# after it - a push to beta cannot undo the rollback by accident. Deleting the
# variable puts `main` back. See README, "Rolling back production".

name: Publish

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same four layers as `npm run verify`, as separate steps so the run page
  # says which one broke. Any red step blocks the publish.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      # The whole history, for the tags: the upgrade journey starts from the
      # release that is live today (the newest v* tag) and updates from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # 24: the browser journeys use Node's built-in WebSocket.
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The raw output of the step can only be read with a token. Repeating its
      # end in an `::error::` makes the reason show up in the run annotation,
      # which is public - the difference between "exit code 1" and knowing what
      # broke.
      - name: Syntax and unit cases
        run: |
          set +e
          output=$(npm test 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            summary=$(echo "$output" | grep -viE '^\s*$' | tail -25 | tr '\n' '%')
            echo "::error::npm test failed (code $code): $summary"
          fi
          exit $code

      # Imports, re-exports and every `namespace.member` against real exports.
      # It existed before but only ran by hand - and 1.10.1's Start button was
      # exactly a `store.member` that no longer existed.
      - name: Modules
        run: |
          set +e
          output=$(python tools/check_modules.py 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            summary=$(echo "$output" | grep -E 'ERROR' | head -15 | tr '\n' '%')
            echo "::error::check_modules failed: $summary"
          fi
          exit $code

      # What a person does, in headless Chrome (preinstalled on the runner).
      - name: Browser journeys
        run: |
          set +e
          output=$(node tests/e2e/run.js 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            summary=$(echo "$output" | sed 's/\x1b\[[0-9;]*m//g' | grep -E '✕|at step|timed out|cannot|logged|Error' | head -20 | tr '\n' '%')
            echo "::error::browser journeys failed: $summary"
          fi
          exit $code

      - name: Screenshots of failed journeys
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Says which code production is about to get, and shouts when it is
      # pinned: a forgotten pin would silently hold back every later release.
      - name: Which ref is production?
        run: |
          if [ -n "$PINNED" ]; then
            echo "::warning::Production is pinned to $PINNED (variable PRODUCTION_REF). Delete the variable to publish main again."
          else
            echo "Production comes from main."
          fi
        env:
          PINNED: ${{ vars.PRODUCTION_REF }}

      - name: Production at the root
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.PRODUCTION_REF || 'main' }}
          path: site

      - name: Does the beta branch exist?
        id: hasbeta
        run: |
          if git ls-remote --exit-code --heads "$REPO" beta >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "No beta branch: the site goes out with production only."
          fi
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}

      - name: Beta at /beta/
        if: steps.hasbeta.outputs.yes == 'true'
        uses: actions/checkout@v4
        with:
          ref: beta
          path: site/beta

      # Which beta commit is live.
      #
      # The app version does not move with every push to beta - it only
      # changes when there is a production release - so without this stamp
      # there would be no way to know whether the device already got the new
      # code. It has to run BEFORE deleting .git, which is where the SHA comes
      # from.
      #
      # The JSON fields ("build", "quando") are read by src/install.js on
      # whichever branch is live, so they keep their names.
      - name: Stamp the beta build
        if: steps.hasbeta.outputs.yes == 'true'
        run: |
          SHA=$(git -C site/beta rev-parse --short HEAD)
          WHEN=$(git -C site/beta log -1 --format=%cI)
          printf '{"build":"%s","quando":"%s"}\n' "$SHA" "$WHEN" \
            > site/beta/build.json
          cat site/beta/build.json

      - name: Remove git metadata
        run: rm -rf site/.git site/beta/.git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # After the deploy, the LIVE site gets the journeys marked `live` (a full
  # match on a phone), with the cloud and Scryfall faked so no real data is
  # touched. Each channel is checked with its own branch's journeys: beta's
  # tests may describe screens production does not have yet.
  #
  # It cannot undo a deploy (the token has no right to change the
  # PRODUCTION_REF variable), but a red run here means "the published site is
  # broken right now" - roll back as in the README, "Rolling back production".
  smoke:
    name: Smoke test of the live site
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: production
            ref: ${{ vars.PRODUCTION_REF || 'main' }}
            path: ''
          - channel: beta
            ref: beta
            path: 'beta/'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Journeys against the published ${{ matrix.channel }}
        run: |
          if [ ! -f tests/e2e/run.js ]; then
            echo "This ref has no browser journeys yet; nothing to smoke-test."
            exit 0
          fi
          # Pages can take a minute to serve the new files everywhere.
          sleep 45
          for attempt in 1 2; do
            node tests/e2e/run.js && exit 0
            echo "Attempt $attempt failed; retrying once in 60s in case the CDN was still warming up."
            sleep 60
          done
          echo "::error::the published ${{ matrix.channel }} site failed its smoke test"
          exit 1
        env:
          E2E_BASE_URL: ${{ needs.publish.outputs.page_url }}${{ matrix.path }}
      - name: Screenshots of the failed smoke test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.channel }}
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
